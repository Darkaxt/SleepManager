name: Publish stable release

# Called only after the signed build succeeds. This workflow never compiles APKs
# and receives no signing secrets: it promotes that build's immutable artifact.
on:
  workflow_call:
    inputs:
      artifact-id:
        description: Exact artifact ID returned by the successful signed build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Darkaxt/SleepManager'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact artifact ID
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
        run: |
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*|0) echo "::error::Missing or invalid artifact ID"; exit 1 ;;
          esac

      - name: Download the validated artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Verify commit, stable versions and APK hashes
        run: |
          set -euo pipefail
          python3 scripts/release_artifacts.py verify \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --variant release \
            --stable \
            --github-env "$GITHUB_ENV"

      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $RELEASE_TAG."
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true)
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "::error::Existing release tag points to a different commit."
            exit 1
          fi

      - name: Publish the validated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$IS_DRAFT" != "false" ]; then
              echo "::error::An existing draft needs review before retrying publication."
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists; leaving its assets and metadata unchanged."
            exit 0
          fi

          # Upload into a draft first so the updater cannot see a partial release.
          gh release create "$RELEASE_TAG" \
            "dist/SleepManager-$VERSION_NAME.apk" \
            "dist/SleepManager-Helper-$HELPER_VERSION_NAME.apk" \
            "dist/update.json" \
            "dist/build-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "SleepManager $VERSION_NAME" \
            --notes-file RELEASE_NOTES.md \
            --draft
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
