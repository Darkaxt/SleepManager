name: Build 0.7 Thor test bundle and stable rollback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thor-test-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SLEEPMANAGER_STORE_PASSWORD: ${{ secrets.SLEEPMANAGER_KEYSTORE_PASSWORD }}
      SLEEPMANAGER_KEY_ALIAS: ${{ secrets.SLEEPMANAGER_KEY_ALIAS }}
      SLEEPMANAGER_KEY_PASSWORD: ${{ secrets.SLEEPMANAGER_KEY_PASSWORD }}

    steps:
      - name: Checkout current 0.7 candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SLEEPMANAGER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]             || [ -z "$SLEEPMANAGER_STORE_PASSWORD" ]             || [ -z "$SLEEPMANAGER_KEY_ALIAS" ]             || [ -z "$SLEEPMANAGER_KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets are not fully configured in SleepManager."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/sleepmanager-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SLEEPMANAGER_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test, lint and build Thor candidate
        run: |
          gradle             :app:testDebugUnitTest             :app:lintDebug             :helper:lintDebug             :app:assembleRelease             :helper:assembleRelease

      - name: Verify candidate packages and certificates
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          MAIN_APK="app/build/outputs/apk/release/app-release.apk"
          HELPER_APK="helper/build/outputs/apk/release/helper-release.apk"

          MAIN_PACKAGE=$("$AAPT" dump badging "$MAIN_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          HELPER_PACKAGE=$("$AAPT" dump badging "$HELPER_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)

          [ "$MAIN_PACKAGE" = "com.med.sleepmanager" ]
          [ "$HELPER_PACKAGE" = "com.med.sleepmanager.helper" ]

          MAIN_CERT=$("$APKSIGNER" verify --print-certs "$MAIN_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          HELPER_CERT=$("$APKSIGNER" verify --print-certs "$HELPER_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          EXPECTED_CERT=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties             | tr '[:upper:]' '[:lower:]' | tr -d ':')

          [ -n "$MAIN_CERT" ]
          [ "$MAIN_CERT" = "$EXPECTED_CERT" ] || {
            echo "::error::Thor candidate Main is not signed with the permanent release certificate."
            exit 1
          }
          [ "$HELPER_CERT" = "$EXPECTED_CERT" ] || {
            echo "::error::Thor candidate Helper is not signed with the permanent release certificate."
            exit 1
          }

      - name: Build stable 0.6.1 source as rollback APKs
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$RUNNER_TEMP/sleepmanager-v0.6.1-rollback"

          CURRENT_MAIN_CODE=$(sed -n 's/^SLEEPMANAGER_VERSION_CODE=//p' gradle.properties)
          CURRENT_HELPER_CODE=$(sed -n 's/^SLEEPMANAGER_HELPER_VERSION_CODE=//p' gradle.properties)

          ROLLBACK_MAIN_CODE=$((CURRENT_MAIN_CODE + 1))
          ROLLBACK_HELPER_CODE=$((CURRENT_HELPER_CODE + 1))

          git clone --depth 1 --branch v0.6.1             https://github.com/Baggio94/SleepManager.git "$ROLLBACK_DIR"

          sed -i             "s/^SLEEPMANAGER_VERSION_CODE=.*/SLEEPMANAGER_VERSION_CODE=$ROLLBACK_MAIN_CODE/"             "$ROLLBACK_DIR/gradle.properties"
          sed -i             "s/^SLEEPMANAGER_HELPER_VERSION_CODE=.*/SLEEPMANAGER_HELPER_VERSION_CODE=$ROLLBACK_HELPER_CODE/"             "$ROLLBACK_DIR/gradle.properties"

          gradle -p "$ROLLBACK_DIR"             :app:assembleRelease             :helper:assembleRelease

          echo "THOR_CANDIDATE_VERSION_CODE=$CURRENT_MAIN_CODE" >> "$GITHUB_ENV"
          echo "THOR_CANDIDATE_HELPER_VERSION_CODE=$CURRENT_HELPER_CODE" >> "$GITHUB_ENV"
          echo "ROLLBACK_VERSION_CODE=$ROLLBACK_MAIN_CODE" >> "$GITHUB_ENV"
          echo "ROLLBACK_HELPER_VERSION_CODE=$ROLLBACK_HELPER_CODE" >> "$GITHUB_ENV"
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"

      - name: Verify rollback packages and certificates
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          MAIN_APK="$ROLLBACK_DIR/app/build/outputs/apk/release/app-release.apk"
          HELPER_APK="$ROLLBACK_DIR/helper/build/outputs/apk/release/helper-release.apk"

          MAIN_PACKAGE=$("$AAPT" dump badging "$MAIN_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          HELPER_PACKAGE=$("$AAPT" dump badging "$HELPER_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)

          [ "$MAIN_PACKAGE" = "com.med.sleepmanager" ]
          [ "$HELPER_PACKAGE" = "com.med.sleepmanager.helper" ]

          MAIN_CERT=$("$APKSIGNER" verify --print-certs "$MAIN_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          HELPER_CERT=$("$APKSIGNER" verify --print-certs "$HELPER_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          EXPECTED_CERT=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties             | tr '[:upper:]' '[:lower:]' | tr -d ':')

          [ "$MAIN_CERT" = "$EXPECTED_CERT" ] || {
            echo "::error::Rollback Main APK is not signed with the permanent release certificate."
            exit 1
          }
          [ "$HELPER_CERT" = "$EXPECTED_CERT" ] || {
            echo "::error::Rollback Helper APK is not signed with the permanent release certificate."
            exit 1
          }

      - name: Prepare Thor test bundle
        run: |
          set -euo pipefail
          mkdir -p thor-dist

          VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_VERSION_NAME=//p' gradle.properties)
          HELPER_VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_HELPER_VERSION_NAME=//p' gradle.properties)

          cp app/build/outputs/apk/release/app-release.apk             "thor-dist/SleepManager-$VERSION_NAME-Thor-test.apk"
          cp helper/build/outputs/apk/release/helper-release.apk             "thor-dist/SleepManager-Helper-$HELPER_VERSION_NAME-Thor-test.apk"

          cp "$ROLLBACK_DIR/app/build/outputs/apk/release/app-release.apk"             "thor-dist/SleepManager-0.6.1-rollback.apk"
          cp "$ROLLBACK_DIR/helper/build/outputs/apk/release/helper-release.apk"             "thor-dist/SleepManager-Helper-1.1.1-rollback.apk"

          CANDIDATE_SHA=$(sha256sum "thor-dist/SleepManager-$VERSION_NAME-Thor-test.apk" | awk '{print $1}')
          HELPER_CANDIDATE_SHA=$(sha256sum "thor-dist/SleepManager-Helper-$HELPER_VERSION_NAME-Thor-test.apk" | awk '{print $1}')
          ROLLBACK_SHA=$(sha256sum thor-dist/SleepManager-0.6.1-rollback.apk | awk '{print $1}')
          HELPER_ROLLBACK_SHA=$(sha256sum thor-dist/SleepManager-Helper-1.1.1-rollback.apk | awk '{print $1}')

          cat > thor-dist/THOR_TEST_INFO.txt <<EOF
          SleepManager Thor physical-test bundle

          Candidate source commit: $GITHUB_SHA
          Main candidate version: $VERSION_NAME
          Main candidate versionCode: $THOR_CANDIDATE_VERSION_CODE
          Main candidate SHA-256: $CANDIDATE_SHA

          Helper candidate version: $HELPER_VERSION_NAME
          Helper candidate versionCode: $THOR_CANDIDATE_HELPER_VERSION_CODE
          Helper candidate SHA-256: $HELPER_CANDIDATE_SHA

          Rollback source: public v0.6.1 tag
          Main rollback versionName: 0.6.1
          Main rollback versionCode: $ROLLBACK_VERSION_CODE
          Main rollback SHA-256: $ROLLBACK_SHA

          Helper rollback versionName: 1.1.1
          Helper rollback versionCode: $ROLLBACK_HELPER_VERSION_CODE
          Helper rollback SHA-256: $HELPER_ROLLBACK_SHA

          All APKs are verified against the permanent SleepManager release certificate.

          Install candidate APKs directly over the installed stable builds without uninstalling.
          After the 0.7 physical test session, return Main to stable 0.6.1 by installing
          SleepManager-0.6.1-rollback.apk directly over the candidate.

          Helper 1.1.2 may remain installed only if compatibility with stable Main 0.6.1
          has been explicitly validated. Otherwise install the included Helper 1.1.1 rollback.

          IMPORTANT:
          Any later Main candidate/final versionCode must be greater than $ROLLBACK_VERSION_CODE
          on a device that used this rollback.

          Any later Helper candidate/final versionCode must be greater than
          $ROLLBACK_HELPER_VERSION_CODE on a device that used the Helper rollback.
          EOF

      - name: Upload Thor test bundle
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-0.7-Thor-test-${{ github.run_attempt }}
          path: thor-dist/*
          if-no-files-found: error
          retention-days: 14
