name: Responsive UI checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "helper/src/main/**"
      - "app/build.gradle.kts"
      - "helper/build.gradle.kts"
      - "scripts/test_emulator_regression.sh"
      - "scripts/run_prebuilt_emulator_tests.sh"
      - "scripts/run_real_sleep_wake_tests.sh"
      - ".github/workflows/responsive-ui.yml"

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate emulator test scripts
        run: |
          bash -n scripts/test_emulator_regression.sh
          bash -n scripts/run_prebuilt_emulator_tests.sh
          bash -n scripts/run_real_sleep_wake_tests.sh

      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run responsive UI matrix
        id: responsive_tests
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
          script: ADB_SERIAL=emulator-5554 SKIP_STATIC=1 ./scripts/test_emulator_regression.sh

      - name: Print responsive UI test results
        if: always()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; || true

      - name: Upload responsive UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/emulator-regression/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare local emulator test bundle
        if: steps.responsive_tests.outcome == 'success'
        id: local_bundle
        run: |
          set -euo pipefail

          VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_VERSION_NAME=//p' gradle.properties)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p local-emulator-test-bundle
          cp app/build/outputs/apk/debug/app-debug.apk             local-emulator-test-bundle/SleepManager-debug.apk
          cp helper/build/outputs/apk/debug/helper-debug.apk             local-emulator-test-bundle/SleepManager-Helper-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk             local-emulator-test-bundle/SleepManager-tests.apk
          cp scripts/run_prebuilt_emulator_tests.sh             local-emulator-test-bundle/run-tests.sh
          cp scripts/run_real_sleep_wake_tests.sh             local-emulator-test-bundle/run-real-e2e.sh
          chmod +x local-emulator-test-bundle/run-tests.sh
          chmod +x local-emulator-test-bundle/run-real-e2e.sh

          cat > local-emulator-test-bundle/README.txt <<EOF
          SleepManager $VERSION_NAME local emulator regression bundle

          1. Start your Android emulator.
          2. Open Terminal in this extracted folder.
          3. Run:
             ./run-tests.sh emulator-5554

          This resets and reinstalls SleepManager + Helper on the selected emulator.
          It leaves Syncthing-Fork, Tailscale, JamesDSP and BasicSync installed and
          automatically uses them for real sleep/wake integration tests when present.

          The suite runs:
          - UI/state regression tests
          - real SCREEN_OFF / SCREEN_ON cycles
          - Wi-Fi and Bluetooth sleep/wake restoration
          - real installed app integration transitions
          - 5 s Grace period
          - Custom delay with instant simulated expiry (no 60 s wait)
          - Advanced battery / charging / Battery Saver / schedule conditions
          - Sync then stop and Periodic sync with BasicSync when available

          Hardware-only clamshell/dock/Charging Separation checks remain for the AYN Thor.
          It refuses physical devices unless ALLOW_PHYSICAL_DEVICE=1 is explicitly set.
          EOF

      - name: Upload local emulator test bundle
        if: steps.responsive_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-${{ steps.local_bundle.outputs.version }}-emulator-tests
          path: local-emulator-test-bundle/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when responsive tests fail
        if: steps.responsive_tests.outcome != 'success'
        run: exit 1
